<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0804">
<title>Le avventure socratiche</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overscroll-behavior:none}
  body{background:#0c0804;font-family:'Lora',serif}
  ::-webkit-scrollbar{width:2px}
  ::-webkit-scrollbar-thumb{background:#3a2810;border-radius:2px}
  input:focus{border-color:rgba(201,169,110,.7)!important}
  button:active{opacity:.85}
  button{font-family:inherit}
  @keyframes mIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}
  @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}

  .app{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
  .titlebar{flex-shrink:0;text-align:center;padding:calc(env(safe-area-inset-top,0px) + 6px) 12px 7px;background:#0a0704;border-bottom:1px solid #1c1408;position:relative;z-index:20}
  .titlebar span{font-family:'Playfair Display',serif;font-size:12.5px;font-style:italic;color:#7a5a24;letter-spacing:.04em;line-height:1.3}

  .mainrow{flex:1;min-height:0;display:flex;overflow:hidden}

  nav.sidebar{width:68px;flex-shrink:0;display:flex;flex-direction:column;background:linear-gradient(180deg,#130f08,#0d0a05);border-right:1px solid #201508;z-index:10;padding-bottom:env(safe-area-inset-bottom,0px)}
  .tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;position:relative;overflow:hidden;cursor:pointer;background:#1a1208;border-bottom:1px solid #2a1f0e}
  .tab-btn.locked{gap:10px;background:#0e0b06;border-bottom:1px solid #1c1409}
  .tab-btn.active{background:linear-gradient(160deg,#d9b46a,#c9a96e,#b58d40);border-bottom:1px solid rgba(0,0,0,.35);cursor:default}
  .tab-num{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;color:#c9a96e;line-height:1}
  .tab-btn.locked .tab-num{font-size:20px;color:#4a3418}
  .tab-btn.active .tab-num{font-size:22px;color:#1a0d04}

  .content{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
  .tabhead{flex-shrink:0;padding:11px 18px 10px;background:linear-gradient(180deg,rgba(9,6,2,.97) 65%,rgba(9,6,2,.82));border-bottom:1px solid #1c1408}
  .tabhead-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .tabhead-titles{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;flex:1;min-width:0}
  .tabhead-name{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;font-style:italic;color:#c9a96e;line-height:1.15;letter-spacing:-.01em}
  .tabhead-translit{font-family:'Lora',serif;font-size:11px;color:#C9A96E;letter-spacing:.03em}
  .translate-btn{flex-shrink:0;background:transparent;border:1px solid #2a1f0e;color:#8b6a32;font-family:'Lora',serif;font-size:8px;padding:5px 9px;cursor:pointer;border-radius:2px;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap;line-height:1}

  .body{flex:1;min-height:0;overflow:hidden;position:relative}
  .pane{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:20px 18px calc(50px + env(safe-area-inset-bottom,0px)) 18px;display:none}
  .pane.show{display:block}

  p.body-text{font-family:'Lora',serif;font-size:14.5px;line-height:1.88;color:#b8a878;margin-bottom:4px;text-wrap:pretty;text-align:justify}
  .verse{font-family:'Playfair Display',serif;font-size:14px;font-style:italic;color:#c9a96e;line-height:2.1;padding:16px 20px;margin-bottom:22px;border-left:2px solid #2a1f0e;opacity:.88}
  .verse.last{margin-bottom:4px}
  .verse.small{font-size:13px;line-height:2.0}
  .verse strong{font-style:normal;letter-spacing:.15em}
  .pane-end{text-align:center;padding:4px 0 6px}
  .pane-end span{font-family:'Playfair Display',serif;font-size:10.5px;color:#3a2810;letter-spacing:.3em;font-style:italic}

  .statue-img{width:calc(100% + 36px);margin:22px -18px;height:calc((100vw - 68px) * 0.5625);background-size:contain;background-repeat:no-repeat;opacity:0;transition:opacity .6s ease;display:block;flex-shrink:0}
  .statue-img.loaded{opacity:var(--op,.7)}

  .modal-overlay{position:fixed;inset:0;z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(6,3,1,.97);backdrop-filter:blur(6px);padding:32px 24px;animation:mIn .3s ease}
  .modal-overlay.show{display:flex}
  .modal-box{width:100%;max-width:310px}
  .modal-divider{display:flex;align-items:center;gap:10px;margin-bottom:20px}
  .modal-divider .line{flex:1;height:1px;background:linear-gradient(90deg,transparent,#3a2810)}
  .modal-divider .line.rev{background:linear-gradient(90deg,#3a2810,transparent)}
  .modal-divider span{font-size:9px;color:#5a3e1a;letter-spacing:.35em;font-family:'Lora',serif;text-transform:uppercase}
  .challenge-box{background:rgba(201,169,110,.06);border:1px solid rgba(201,169,110,.18);border-radius:2px;padding:14px 16px;margin-bottom:22px}
  .challenge-label{font-family:'Lora',serif;font-size:8.5px;color:#5a3e1a;letter-spacing:.25em;text-transform:uppercase;margin-bottom:8px}
  .challenge-text{font-family:'Playfair Display',serif;font-size:15px;font-style:italic;color:#c9a96e;line-height:1.5}
  .field-label{font-family:'Lora',serif;font-size:9.5px;color:#8b6030;margin-bottom:8px;letter-spacing:.18em;text-transform:uppercase}
  .pin-input{width:100%;background:rgba(255,255,255,.03);border:1px solid rgba(201,169,110,.32);color:#e8d5a3;font-family:'Playfair Display',serif;font-size:28px;padding:12px 16px;outline:none;border-radius:2px;letter-spacing:.5em;display:block;text-align:center}
  .pw-input{width:100%;background:rgba(255,255,255,.03);border:1px solid rgba(201,169,110,.32);color:#e8d5a3;font-family:'Lora',serif;font-size:17px;padding:13px 16px;outline:none;border-radius:2px;letter-spacing:.06em;display:block}
  .error-text{font-family:'Lora',serif;font-size:12px;color:#b04040;margin-bottom:12px;text-align:center;letter-spacing:.1em;animation:shake .35s ease}
  .modal-actions{display:flex;gap:10px;margin-top:4px}
  .btn-primary{flex:1;background:linear-gradient(135deg,#c9a96e,#a87c38);border:none;color:#1a0d04;font-family:'Playfair Display',serif;font-size:14px;font-weight:700;padding:14px 10px;cursor:pointer;border-radius:2px;letter-spacing:.06em}
  .btn-secondary{background:transparent;border:1px solid #2a1f0e;color:#6b4c22;font-family:'Lora',serif;font-size:14px;padding:14px 18px;cursor:pointer;border-radius:2px}

  .modal-title{text-align:center;margin-bottom:26px}
  .modal-title .name{font-family:'Playfair Display',serif;font-size:26px;font-weight:700;font-style:italic;color:#c9a96e;line-height:1.2}
  .modal-title .translit{font-family:'Lora',serif;font-size:12px;color:#8b6a32;letter-spacing:.03em;margin-top:4px}
  .modal-title .italian{font-family:'Lora',serif;font-size:11px;color:#6b4c22;font-style:italic;margin-top:3px}
</style>
</head>
<body>
<div class="app">
  <div class="titlebar"><span id="siteTitle">Αἱ Σωκρατικαὶ πράξεις Ἱλαρίου</span></div>

  <div class="mainrow">
    <nav class="sidebar" id="sidebar"></nav>

    <div class="content">
      <div class="tabhead">
        <div class="tabhead-row">
          <div class="tabhead-titles">
            <div class="tabhead-name" id="activeName"></div>
            <div class="tabhead-translit" id="activeTranslit"></div>
          </div>
          <button class="translate-btn" id="translateBtn">TRADUZIONE</button>
        </div>
      </div>

      <div class="body" id="body"></div>
    </div>
  </div>
</div>

<!-- PIN modal -->
<div class="modal-overlay" id="pinModal">
  <div class="modal-box">
    <div class="modal-divider"><div class="line"></div><span>μετάφρασις</span><div class="line rev"></div></div>
    <div class="challenge-box">
      <div class="challenge-label">ἄθλον · sfida</div>
      <div class="challenge-text" id="pinChallengeText"></div>
    </div>
    <div style="margin-bottom:14px">
      <div class="field-label">κωδικός · pin</div>
      <input type="tel" maxlength="4" id="pinInput" class="pin-input" placeholder="· · · ·">
    </div>
    <div class="error-text" id="pinError" style="display:none">ἐσφαλμένον</div>
    <div class="modal-actions">
      <button class="btn-primary" id="pinSubmit">Invia</button>
      <button class="btn-secondary" id="pinClose">✕</button>
    </div>
  </div>
</div>

<!-- Password modal -->
<div class="modal-overlay" id="pwModal">
  <div class="modal-box">
    <div class="modal-divider"><div class="line"></div><span>κεκλεισμένον</span><div class="line rev"></div></div>
    <div class="modal-title">
      <div class="name" id="pwName"></div>
      <div class="translit" id="pwTranslit"></div>
      <div class="italian" id="pwItalian"></div>
    </div>
    <div style="margin-bottom:14px">
      <div class="field-label">σύνθημα</div>
      <input type="password" id="pwInput" class="pw-input" placeholder="···">
    </div>
    <div class="error-text" id="pwError" style="display:none">ἐσφαλμένον</div>
    <div class="modal-actions">
      <button class="btn-primary" id="pwSubmit">εἴσελθε</button>
      <button class="btn-secondary" id="pwClose">✕</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
